# ── Server ──────────────────────────────────────────
server.port=${PORT:8080}

# ── Database (Railway injects PG* env vars automatically) ──
spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:taskmanager}
spring.datasource.username=${PGUSER:postgres}
spring.datasource.password=${PGPASSWORD:shashank123}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA ─────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ── JWT ─────────────────────────────────────────────
jwt.secret=${JWT_SECRET:TaskManager$ecretKey!2024ForJWTSigning@Railway}
jwt.expiration=86400000

# ── Static resources (React build output) ───────────
spring.web.resources.static-locations=classpath:/static/
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=true
